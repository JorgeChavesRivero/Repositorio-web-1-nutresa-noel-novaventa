<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazón · Mercadeo</title>
  <link rel="stylesheet" href="../../assets/css/sazon.css">
  <link rel="stylesheet" href="mercadeo.css">
</head>
<body>
  <header data-layout="header"></header>
  <main class="contenedor pagina-modulo">
    <section class="bloque-modulo">
      <h1>Módulo Mercadeo</h1>
      <!-- inicio del codigo de campaña -->
      <div class="banner-campana">
      <img src="https://img.icons8.com/?size=100&id=2930&format=png&color=000000" alt="megafono">
      <div class="texto-contenedor">
        <h3>Semana de la pasta</h3>
        <p>Cocina 3 recetas con Doria y gana 150 puntos • vigente hasta el 30</p>
        </div>
        <button class="boton-participar">Participar</button>
      </div>
      <!-- fin del codigo de campaña -->
      <div id="mercadeo-estado" class="mensaje-estado" role="status"></div>
    </section>
  </main>
  <footer data-layout="footer"></footer>
  <script src="../../services/api.config.js"></script>
  <script src="../../data/usuario.js"></script>
  <script src="../../data/productos.js"></script>
  <script src="../../data/recetas.js"></script>
  <script src="../../data/modulos.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="servicio.js"></script>
  <script src="index.js"></script>
</body>
</html>
